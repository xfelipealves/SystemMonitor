name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build universal app
        run: ./build.sh zip

      - uses: actions/upload-artifact@v4
        with:
          name: SystemMonitor
          path: build/SystemMonitor.zip
