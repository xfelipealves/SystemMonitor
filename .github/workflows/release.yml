name: Release

# Push a tag like v1.1.0 (matching CFBundleShortVersionString) to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $version"
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Build universal app
        run: ./build.sh zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes = this version's section of CHANGELOG.md
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" build/SystemMonitor.zip \
            --title "SystemMonitor $GITHUB_REF_NAME" --notes "$notes"
